x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

    ALPACA_API_KEY: ${ALPACA_API_KEY}
    ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}

    REDPANDA_BROKER: redpanda:29092

    PIPELINE_POSTGRES_HOST: postgres
    PIPELINE_POSTGRES_PORT: 5432
    PIPELINE_POSTGRES_DB: ${POSTGRES_DB}
    PIPELINE_POSTGRES_USER: ${POSTGRES_USER}
    PIPELINE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/auth/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    - ./airflow/data:/opt/airflow/data
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8080:8080"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  airflow-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: db migrate
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8082:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail http://localhost:8080/api/v2/monitor/health || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-api-server:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor

  producer:
    build: ./producer
    depends_on:
      - redpanda
    environment:
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      TICKERS: ${TICKERS}
      REDPANDA_BROKER: redpanda:29092
      PYTHONUNBUFFERED: "1"

  jobmanager:
    build: ./flink
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 1
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - ./flink/jobs:/opt/flink/jobs
      - flink-checkpoints:/opt/flink/checkpoints

  taskmanager:
    build: ./flink
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 3072m
        parallelism.default: 1
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - ./flink/jobs:/opt/flink/jobs
      - flink-checkpoints:/opt/flink/checkpoints

  flink-submitter:
    build: ./flink
    entrypoint:
      - python
      - /opt/flink/submitter.py
    depends_on:
      - jobmanager
      - taskmanager
    volumes:
      - ./flink/jobs:/opt/flink/jobs:ro

  sink:
    build: ./sink
    depends_on:
      - redpanda
      - postgres
    environment:
      REDPANDA_BROKER: redpanda:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PYTHONUNBUFFERED: "1"

  dashboard:
    build: ./dashboard
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_API_URL: http://airflow-api-server:8080
      AIRFLOW_USERNAME: airflow
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app
      - ./airflow/auth/simple_auth_manager_passwords.json:/run/secrets/airflow_passwords.json:ro

volumes:
  redpanda-data:
  postgres-data:
  airflow-postgres-data:
  flink-checkpoints:
